name: oracle

# Проверка лабораторий на живых брокерах (RabbitMQ, Kafka): заготовка падает, решение проходит.
# Запускается вручную, по расписанию и при изменении лабораторий.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths: ['labs/**', '.github/workflows/oracle.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Дымовая проверка docker compose (postgres, redis, rabbitmq, kafka)
        run: bash labs/scripts/smoke.sh

  brokers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Лаборатории модуля 8 на живых брокерах
        run: bash labs/scripts/run-broker-labs.sh

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 'Изоляция транзакций: модель против реального PostgreSQL'
        run: |
          cd labs && docker compose up -d --wait postgres
          cd m03/isolation && npm install --no-audit --no-fund && npm test

  capstone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Эталон capstone на PostgreSQL и RabbitMQ
        run: |
          cd labs && docker compose up -d --wait postgres rabbitmq
          cd m13/capstone-nest && npm install --no-audit --no-fund
          cd ../../.. && DATABASE_URL=postgres://lab:lab@localhost:5432/lab AMQP_URL=amqp://guest:guest@localhost:5672 npx tsx --tsconfig labs/m13/capstone-nest/tsconfig.json labs/m13/capstone-nest/test.ts
