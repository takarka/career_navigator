name: release

# При пуше тега v* собирает dist-single и dist-offline и публикует релиз с заметками из docs/RELEASE.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (создаётся на текущем коммите ветки, если его нет)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборки
        run: |
          npm run build:single
          npm run build:offline
          mkdir -p release
          cp dist-single/index.html release/textbook-single.html
          (cd dist-offline && zip -qr ../release/textbook-offline.zip .)
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" release/textbook-single.html release/textbook-offline.zip --title "$TAG" --notes-file docs/RELEASE.md --target "$GITHUB_SHA"
