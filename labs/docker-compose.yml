# Общее окружение для лабораторий (модули 3, 4, 8 и далее).
# Файл подготовлен заранее и ещё НЕ проверен запуском: его проверка входит в этап модулей 3, 4 и 8.
# Запуск нужного сервиса: docker compose up -d postgres redis rabbitmq kafka
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports: ['5672:5672', '15672:15672'] # 15672 — веб-интерфейс (guest/guest)
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest # режим KRaft, без ZooKeeper
    ports: ['9092:9092']
